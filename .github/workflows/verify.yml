name: Cost safety engineering checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified 2026-10-08
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Prepare dependencies; no package lifecycle execution
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp2
          # The sandbox exposes /usr read-only, not setup-node's /opt cache.
          cost_safety_node="$(command -v node)"
          if [ ! "$cost_safety_node" -ef /usr/bin/node ]; then
            sudo install -m 0755 "$cost_safety_node" /usr/bin/node
          fi
          /usr/bin/node --version
          npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Run deterministic, sandboxed runtime and clean package checks
        run: |
          cost_safety_npm="$(command -v npm)"
          export PATH="/usr/bin:/bin:$PATH"
          "$cost_safety_npm" test
      - name: Save actual execution records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cost-safety-engineering-records
          include-hidden-files: true
          path: |
            .cost-safety/test-results
            .cost-safety/package-check.json
          if-no-files-found: error
